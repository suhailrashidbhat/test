<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BubblePop — Game Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a14;
    font-family: -apple-system, 'SF Pro Rounded', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    min-height: 100vh;
    color: white;
  }

  h1 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    margin-bottom: 40px;
  }

  .screens {
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
  }

  .screen-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .screen-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
  }

  /* iPhone shell */
  .iphone {
    width: 320px;
    height: 640px;
    background: #0b0b1e;
    border-radius: 46px;
    border: 2px solid rgba(255,255,255,0.12);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.05),
      0 30px 80px rgba(0,0,0,0.8),
      inset 0 1px 1px rgba(255,255,255,0.08);
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }

  /* Notch */
  .iphone::before {
    content: '';
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 26px;
    background: #0b0b1e;
    border-radius: 20px;
    z-index: 100;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.08);
  }

  /* ═══════════════════════════════════
     SCREEN 1: MENU
  ═══════════════════════════════════ */

  .menu-screen {
    background: linear-gradient(160deg, #0a0a1e 0%, #120820 100%);
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* Decorative bg bubbles */
  .deco-bubble {
    position: absolute;
    border-radius: 50%;
    filter: blur(8px);
    opacity: 0.12;
  }

  .menu-title-bubbles {
    display: flex;
    align-items: center;
    gap: -8px;
    margin-bottom: 12px;
  }

  .title-dot {
    border-radius: 50%;
    display: inline-block;
  }

  .menu-title {
    font-size: 42px;
    font-weight: 900;
    background: linear-gradient(90deg, #1ac0ff, #be5cff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    letter-spacing: -1px;
    margin-bottom: 6px;
    filter: drop-shadow(0 0 20px rgba(26,192,255,0.3));
  }

  .menu-subtitle {
    font-size: 15px;
    color: rgba(255,255,255,0.4);
    font-weight: 400;
    margin-bottom: 44px;
  }

  .best-score {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 36px;
  }

  .best-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .best-value {
    font-size: 38px;
    font-weight: 800;
    color: white;
  }

  .play-btn {
    background: linear-gradient(90deg, #1ac0ff, #be5cff);
    border: none;
    border-radius: 50px;
    width: 160px;
    height: 54px;
    font-size: 22px;
    font-weight: 900;
    color: #0a0a14;
    letter-spacing: 1px;
    box-shadow: 0 8px 30px rgba(26,192,255,0.4);
    cursor: pointer;
    animation: pulse 1.5s ease-in-out infinite;
    margin-bottom: 14px;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  .tap-hint {
    font-size: 12px;
    color: rgba(255,255,255,0.25);
    font-weight: 400;
  }

  /* ═══════════════════════════════════
     SCREEN 2: GAMEPLAY
  ═══════════════════════════════════ */

  .game-screen {
    background: linear-gradient(160deg, #0a0a1e 0%, #120820 100%);
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
  }

  /* HUD */
  .hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 40px 20px 12px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }

  .hud-col {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .hud-col.right { align-items: flex-end; }

  .hud-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: rgba(255,255,255,0.45);
    text-transform: uppercase;
  }

  .hud-value {
    font-size: 28px;
    font-weight: 800;
    color: white;
    line-height: 1;
  }

  .hud-value.blue { color: #1ac0ff; }

  .lives {
    display: flex;
    gap: 5px;
  }

  .heart {
    font-size: 20px;
  }

  .heart.empty { opacity: 0.2; }

  /* Bubble */
  .bubble {
    position: absolute;
    border-radius: 50%;
    cursor: pointer;
    transform-origin: center;
  }

  .bubble-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    position: relative;
    overflow: hidden;
  }

  .bubble-glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(10px);
    opacity: 0.3;
    transform: translate(-50%, -50%);
    top: 50%;
    left: 50%;
  }

  .bubble-highlight {
    position: absolute;
    background: rgba(255,255,255,0.35);
    border-radius: 50%;
    top: 18%;
    left: 18%;
    width: 35%;
    height: 25%;
    transform: rotate(-15deg);
  }

  /* SVG ring drawn per bubble via inline */
  .bubble-ring {
    position: absolute;
    top: -5px;
    left: -5px;
  }

  /* Score popup */
  .score-popup {
    position: absolute;
    font-size: 20px;
    font-weight: 800;
    color: white;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    pointer-events: none;
    animation: floatUp 0.8s ease-out forwards;
  }

  @keyframes floatUp {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(-50px); }
  }

  /* Combo flash */
  .combo-flash {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.65);
    border: 1.5px solid rgba(255,224,26,0.5);
    border-radius: 18px;
    padding: 14px 24px;
    text-align: center;
    pointer-events: none;
  }

  .combo-label { font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.75); }
  .combo-mult { font-size: 48px; font-weight: 900; color: #ffe01a; line-height: 1.1; }

  /* Pause btn */
  .pause-btn {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 32px;
    color: rgba(255,255,255,0.3);
    cursor: pointer;
  }

  /* ═══════════════════════════════════
     SCREEN 3: GAME OVER
  ═══════════════════════════════════ */

  .gameover-screen {
    background: linear-gradient(160deg, #0a0a1e 0%, #120820 100%);
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .gameover-title {
    font-size: 32px;
    font-weight: 900;
    color: white;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  .final-score {
    font-size: 86px;
    font-weight: 900;
    background: linear-gradient(90deg, #1ac0ff, #be5cff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    filter: drop-shadow(0 0 20px rgba(26,192,255,0.3));
  }

  .final-label {
    font-size: 16px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 20px;
  }

  .new-high {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,224,26,0.12);
    border: 1.5px solid rgba(255,224,26,0.4);
    border-radius: 12px;
    padding: 9px 18px;
    margin-bottom: 40px;
    animation: pop-in 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  @keyframes pop-in {
    from { transform: scale(0.3); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .new-high span { font-size: 14px; font-weight: 700; color: #ffe01a; }

  .replay-btn {
    background: linear-gradient(90deg, #1ac0ff, #be5cff);
    border: none;
    border-radius: 50px;
    width: 200px;
    height: 54px;
    font-size: 20px;
    font-weight: 900;
    color: #0a0a14;
    letter-spacing: 1px;
    box-shadow: 0 8px 30px rgba(26,192,255,0.35);
    cursor: pointer;
    margin-bottom: 14px;
  }

  .menu-link {
    font-size: 15px;
    font-weight: 600;
    color: rgba(255,255,255,0.45);
    cursor: pointer;
    background: none;
    border: none;
  }

  /* Confetti dots */
  .confetti-dot {
    position: absolute;
    border-radius: 50%;
    opacity: 0.7;
    animation: fall 2s ease-out both;
  }

  @keyframes fall {
    from { transform: translateY(-30px); opacity: 0.8; }
    to { transform: translateY(660px); opacity: 0; }
  }
</style>
</head>
<body>

<h1>BubblePop — Screen Previews</h1>

<div class="screens">

  <!-- ── SCREEN 1: MENU ── -->
  <div class="screen-wrap">
    <div class="screen-label">Menu</div>
    <div class="iphone">
      <div class="menu-screen">
        <!-- Decorative bg bubbles -->
        <div class="deco-bubble" style="width:100px;height:100px;background:#ff4545;left:5%;top:12%"></div>
        <div class="deco-bubble" style="width:70px;height:70px;background:#1ac0ff;right:5%;top:20%"></div>
        <div class="deco-bubble" style="width:80px;height:80px;background:#be5cff;left:40%;top:6%"></div>
        <div class="deco-bubble" style="width:55px;height:55px;background:#33e666;left:8%;top:55%"></div>
        <div class="deco-bubble" style="width:90px;height:90px;background:#ff9a1a;right:5%;top:57%"></div>
        <div class="deco-bubble" style="width:60px;height:60px;background:#ffe01a;left:55%;top:72%"></div>

        <!-- Animated title bubbles -->
        <div style="display:flex;align-items:center;margin-left:-10px;margin-bottom:14px;">
          <div style="width:34px;height:34px;border-radius:50%;background:#ff4545;animation:pulse 1.1s ease-in-out infinite;box-shadow:0 0 14px rgba(255,69,69,0.5)"></div>
          <div style="width:26px;height:26px;border-radius:50%;background:#1ac0ff;margin-left:-6px;margin-top:-8px;animation:pulse 0.9s ease-in-out infinite 0.15s;box-shadow:0 0 12px rgba(26,192,255,0.5)"></div>
          <div style="width:30px;height:30px;border-radius:50%;background:#be5cff;margin-left:-6px;animation:pulse 1.3s ease-in-out infinite 0.3s;box-shadow:0 0 12px rgba(190,92,255,0.5)"></div>
        </div>

        <div class="menu-title">Bubble Pop</div>
        <div class="menu-subtitle">Tap fast. Pop all.</div>

        <div class="best-score">
          <div class="best-label">Best</div>
          <div class="best-value">247</div>
        </div>

        <button class="play-btn">PLAY</button>
        <div class="tap-hint">Tap bubbles before they vanish!</div>
      </div>
    </div>
  </div>

  <!-- ── SCREEN 2: GAMEPLAY ── -->
  <div class="screen-wrap">
    <div class="screen-label">Gameplay</div>
    <div class="iphone">
      <div class="game-screen">

        <!-- HUD -->
        <div class="hud">
          <div class="hud-col">
            <div class="hud-label">Score</div>
            <div class="hud-value">184</div>
          </div>
          <div class="lives">
            <span class="heart">❤️</span>
            <span class="heart">❤️</span>
            <span class="heart empty">🤍</span>
          </div>
          <div class="hud-col right">
            <div class="hud-label">Level</div>
            <div class="hud-value blue">5</div>
          </div>
        </div>

        <!-- Bubble 1: Red, mostly full ring -->
        <div class="bubble" style="left:48px;top:140px;width:80px;height:80px;">
          <svg class="bubble-ring" width="90" height="90" viewBox="0 0 90 90">
            <circle cx="45" cy="45" r="41" fill="none" stroke="rgba(255,69,69,0.7)" stroke-width="3.5"
              stroke-dasharray="257.6" stroke-dashoffset="51" stroke-linecap="round"
              transform="rotate(-90 45 45)"/>
          </svg>
          <div class="bubble-inner" style="background:radial-gradient(circle at 35% 30%, rgba(255,120,120,0.9), #ff4545);">
            <div class="bubble-highlight"></div>
          </div>
          <div class="bubble-glow" style="width:110%;height:110%;background:#ff4545;"></div>
        </div>

        <!-- Bubble 2: Purple, half ring -->
        <div class="bubble" style="left:190px;top:160px;width:70px;height:70px;">
          <svg class="bubble-ring" width="80" height="80" viewBox="0 0 80 80">
            <circle cx="40" cy="40" r="36" fill="none" stroke="#ffe01a" stroke-width="3.5"
              stroke-dasharray="226.2" stroke-dashoffset="113" stroke-linecap="round"
              transform="rotate(-90 40 40)"/>
          </svg>
          <div class="bubble-inner" style="background:radial-gradient(circle at 35% 30%, rgba(200,130,255,0.9), #be5cff);">
            <div class="bubble-highlight"></div>
          </div>
          <div class="bubble-glow" style="width:110%;height:110%;background:#be5cff;"></div>
        </div>

        <!-- Bubble 3: Green, near full -->
        <div class="bubble" style="left:100px;top:270px;width:88px;height:88px;">
          <svg class="bubble-ring" width="98" height="98" viewBox="0 0 98 98">
            <circle cx="49" cy="49" r="45" fill="none" stroke="rgba(51,230,102,0.8)" stroke-width="3.5"
              stroke-dasharray="282.7" stroke-dashoffset="28" stroke-linecap="round"
              transform="rotate(-90 49 49)"/>
          </svg>
          <div class="bubble-inner" style="background:radial-gradient(circle at 35% 30%, rgba(100,255,150,0.9), #33e666);">
            <div class="bubble-highlight"></div>
          </div>
          <div class="bubble-glow" style="width:110%;height:110%;background:#33e666;"></div>
        </div>

        <!-- Bubble 4: Blue, urgent (red ring) -->
        <div class="bubble" style="left:32px;top:360px;width:66px;height:66px;">
          <svg class="bubble-ring" width="76" height="76" viewBox="0 0 76 76">
            <circle cx="38" cy="38" r="34" fill="none" stroke="#ff4545" stroke-width="3.5"
              stroke-dasharray="213.6" stroke-dashoffset="171" stroke-linecap="round"
              transform="rotate(-90 38 38)"/>
          </svg>
          <div class="bubble-inner" style="background:radial-gradient(circle at 35% 30%, rgba(80,200,255,0.9), #1ac0ff);">
            <div class="bubble-highlight"></div>
          </div>
          <div class="bubble-glow" style="width:110%;height:110%;background:#1ac0ff;"></div>
        </div>

        <!-- Bubble 5: Orange -->
        <div class="bubble" style="left:196px;top:320px;width:74px;height:74px;">
          <svg class="bubble-ring" width="84" height="84" viewBox="0 0 84 84">
            <circle cx="42" cy="42" r="38" fill="none" stroke="rgba(255,154,26,0.75)" stroke-width="3.5"
              stroke-dasharray="238.8" stroke-dashoffset="60" stroke-linecap="round"
              transform="rotate(-90 42 42)"/>
          </svg>
          <div class="bubble-inner" style="background:radial-gradient(circle at 35% 30%, rgba(255,180,80,0.9), #ff9a1a);">
            <div class="bubble-highlight"></div>
          </div>
          <div class="bubble-glow" style="width:110%;height:110%;background:#ff9a1a;"></div>
        </div>

        <!-- Bubble 6: Yellow, small -->
        <div class="bubble" style="left:148px;top:455px;width:58px;height:58px;">
          <svg class="bubble-ring" width="68" height="68" viewBox="0 0 68 68">
            <circle cx="34" cy="34" r="30" fill="none" stroke="rgba(255,224,26,0.8)" stroke-width="3.5"
              stroke-dasharray="188.5" stroke-dashoffset="38" stroke-linecap="round"
              transform="rotate(-90 34 34)"/>
          </svg>
          <div class="bubble-inner" style="background:radial-gradient(circle at 35% 30%, rgba(255,240,100,0.9), #ffe01a);">
            <div class="bubble-highlight"></div>
          </div>
          <div class="bubble-glow" style="width:110%;height:110%;background:#ffe01a;"></div>
        </div>

        <!-- Score popup -->
        <div class="score-popup" style="left:200px;top:260px;animation-delay:0.1s">+4</div>

        <!-- Combo flash -->
        <div class="combo-flash">
          <div class="combo-label">COMBO!</div>
          <div class="combo-mult">x3</div>
        </div>

        <!-- Pause -->
        <div class="pause-btn">⏸</div>
      </div>
    </div>
  </div>

  <!-- ── SCREEN 3: GAME OVER ── -->
  <div class="screen-wrap">
    <div class="screen-label">Game Over</div>
    <div class="iphone">
      <div class="gameover-screen">
        <!-- Confetti -->
        <script>
          document.addEventListener('DOMContentLoaded', () => {
            const colors = ['#ff4545','#1ac0ff','#be5cff','#33e666','#ff9a1a','#ffe01a'];
            const container = document.querySelector('.gameover-screen');
            for (let i = 0; i < 30; i++) {
              const dot = document.createElement('div');
              dot.className = 'confetti-dot';
              dot.style.cssText = `
                width:${6+Math.random()*8}px;
                height:${6+Math.random()*8}px;
                background:${colors[Math.floor(Math.random()*colors.length)]};
                left:${Math.random()*100}%;
                top:-20px;
                animation-delay:${Math.random()*1.5}s;
                animation-duration:${1.5+Math.random()*1}s;
              `;
              container.appendChild(dot);
            }
          });
        </script>

        <div class="gameover-title">GAME OVER</div>
        <div class="final-score">312</div>
        <div class="final-label">points</div>

        <div class="new-high">
          <span>⭐</span>
          <span>NEW HIGH SCORE!</span>
          <span>⭐</span>
        </div>

        <button class="replay-btn">PLAY AGAIN</button>
        <button class="menu-link">Main Menu</button>
      </div>
    </div>
  </div>

</div>

<p style="margin-top:48px;font-size:12px;color:rgba(255,255,255,0.2);letter-spacing:1px;">
  BUBBLEPOP · iOS 16+ · SWIFTUI · NO DEPENDENCIES
</p>

</body>
</html>
